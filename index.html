<!DOCTYPE html>
<html>
    <head>
        <title>My Calendar</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <link rel="stylesheet" type="text/css" media="screen" href="style.css"/>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Signika:wght@300;400&display=swap" rel="stylesheet">
    </head>

    <body class="Theme-black">
        <h1>My Calendar</h1>
        <div>
            <input type="text" placeholder="Type something..." id="cal-input"></input>
            <input type="color" id="cal-color"></input>
            <button id="cal-button" onclick="inputing()">Add to Calendar</button>
        </div>
        <div>
            <table id='Cal-main'>
                <tr class="Cal-title-row">
                  <td>Sunday</td>
                  <td>Monday</td>
                  <td>Tuesday</td>
                  <td>Wednesday</td>
                  <td>Thursday</td>
                  <td>Friday</td>
                  <td>Saturday</td>
                </tr>
                <tr class="Cal-content-row">
                  <td class='date' id="d1">4</td>
                  <td class='date' id="d2">5</td>
                  <td class='date' id="d3">6</td>
                  <td class='date' id="d4">7</td>
                  <td class='date' id="d5">8</td>
                  <td class='date' id="d6">9</td>
                  <td class='date' id="d7">10</td>
                </tr>
                <tr class="Cal-content-row">
                    <td class='date' id="d8">11</td>
                    <td class='date' id="d9">12</td>
                    <td class='date' id="d10">13</td>
                    <td class='date' id="d11">14</td>
                    <td class='date' id="d12">15</td>
                    <td class='date' id="d13">16</td>
                    <td class='date' id="d14">17</td>
                </tr>
                <tr class="Cal-content-row">
                  <td class='date' id="d15">18</td>
                  <td class='date' id="d16">19</td>
                  <td class='date' id="d17">20</td>
                  <td class='date' id="d18">21</td>
                  <td class='date' id="d19">22</td>
                  <td class='date' id="d20">23</td>
                  <td class='date' id="d21">24</td>
                </tr>
                <tr class="Cal-content-row">
                    <td class='date' id="d22">25</td>
                    <td class='date' id="d23">26</td>
                    <td class='date' id="d24">27</td>
                    <td class='date' id="d25">28</td>
                    <td class='date' id="d26">29</td>
                    <td class='date' id="d27">30</td>
                    <td class='date' id="d28">31</td>
                </tr>
              </table>
        </div>
        <div>
            <button class="ChooseTheme" id="Theme-black"></button>
            <button class="ChooseTheme" id="Theme-red"></button>
            <button class="ChooseTheme" id="Theme-blue"></button>
            <button class="ChooseTheme" id="Theme-purple"></button>
        </div>
        <script src="main.js"></script>
    </body>
</html>
